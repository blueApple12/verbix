<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>Verbix PRO Elite</title>
    <style>
        :root { --gold-main: #d89330; --gold-bright: #ffcc66; --gold-deep: #5e3a00; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; background: #000; 
            color: #ffdca8; font-family: 'Segoe UI', sans-serif; overflow: hidden; position: fixed;
        }
        canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        #menu { 
            position: relative; z-index: 10; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; height: 100vh; padding: 20px;
        }
        .logo-wrap { position: relative; margin-bottom: 30px; }
        h1 { 
            font-family: 'Arial Black', sans-serif; font-size: clamp(60px, 18vw, 95px); 
            margin: 0; background: linear-gradient(180deg, #fff 0%, var(--gold-bright) 35%, var(--gold-main) 60%, var(--gold-deep) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
        }
        .pro-tag { 
            position: absolute; top: -22px; left: -15px; font-size: 20px; font-weight: 900; 
            transform: rotate(-10deg); z-index: 2; padding: 4px 12px; background: #000;
            border-radius: 6px; border: 2px solid var(--gold-main); color: var(--gold-bright);
        }
        .input-group { width: 90%; max-width: 380px; display: flex; flex-direction: column; gap: 10px; }
        input, .stepper { 
            width: 100%; padding: 14px; border-radius: 12px; border: 2px solid var(--gold-deep); 
            background: rgba(20, 10, 5, 0.85); color: #fff; text-align: center; font-size: 16px; 
        }
        .stepper { display: flex; justify-content: space-between; align-items: center; padding: 5px 15px; }
        .step-btn { background: none; border: none; color: var(--gold-bright); font-size: 24px; cursor: pointer; }
        button#bt { 
            margin-top: 25px; width: 90%; max-width: 380px; padding: 18px; border-radius: 50px; 
            font-size: 20px; font-weight: 800; background: linear-gradient(to bottom, var(--gold-bright), var(--gold-main)); 
            color: #1a0500; border: 1px solid #fff; cursor: pointer;
        }
        #blackout { position: fixed; inset: 0; background: #000; z-index: 999; display: none; }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="menu">
    <div class="logo-wrap"><div class="pro-tag">PRO</div><h1>VERBIX</h1></div>
    <div class="input-group">
        <input id="token" type="password" placeholder="HuggingFace Token (hf_...)">
        <input id="sw" placeholder="Start Triggers">
        <input id="ew" placeholder="End Triggers">
        <div class="stepper">
            <button class="step-btn" onclick="u(-1)">−</button>
            <div style="text-align: center;"><div style="font-size:10px;">WORDS</div><span id="wc">1</span></div>
            <button class="step-btn" onclick="u(1)">+</button>
        </div>
    </div>
    <button id="bt">ACTIVATE GHOST MODE</button>
</div>
<div id="blackout"></div>

<script>
const $ = i => document.getElementById(i);
const st = { f: false, l: false, c: 1, recorder: null };
const d = { s: $("sw"), e: $("ew"), bt: $("bt"), bl: $("blackout"), wc: $("wc"), tk: $("token") };

function u(v) { st.c = Math.max(1, Math.min(10, st.c + v)); d.wc.innerText = st.c; }

// --- Background Visuals ---
const ctx = $("canvas").getContext("2d");
const res = () => { $("canvas").width = innerWidth; $("canvas").height = innerHeight; };
window.onresize = res; res();
class P { constructor(){this.reset();} reset(){this.x=Math.random()*innerWidth;this.y=Math.random()*innerHeight;this.r=Math.random()*2;this.v=Math.random()*0.5+0.2;this.o=Math.random()*0.6;} draw(){this.y-=this.v;this.o-=0.005;if(this.y<0||this.o<=0)this.reset();ctx.fillStyle=`rgba(216,147,48,${this.o})`;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,7);ctx.fill();}}
const pts = Array.from({length: 600}, () => new P());
(function anim() { ctx.clearRect(0,0,innerWidth,innerHeight); pts.forEach(p=>p.draw()); requestAnimationFrame(anim); })();

// --- Ghost Whisper Engine ---
async function queryWhisper(blob) {
    if (st.f) return;
    try {
        const response = await fetch(
            "https://api-inference.huggingface.co/models/openai/whisper-large-v3",
            {
                headers: { Authorization: `Bearer ${d.tk.value}` },
                method: "POST",
                body: blob,
            }
        );
        const result = await response.json();
        if (result.text) checkTriggers(result.text.toLowerCase().replace(/[.,!?״"']/g, ""));
    } catch (e) { console.error("HF Whisper Error:", e); }
}

function checkTriggers(txt) {
    const sT = d.s.value.split(",").map(x => x.trim().toLowerCase()).filter(Boolean);
    const eT = d.e.value.split(",").map(x => x.trim().toLowerCase()).filter(Boolean);

    for (let ph of sT) {
        if (txt.includes(ph)) {
            const target = txt.split(ph).pop().trim().split(/\s+/).slice(0, st.c).join(" ");
            if (target) reveal(target);
        }
    }
    for (let ph of eT) {
        if (txt.includes(ph)) {
            const parts = txt.split(ph);
            const before = parts[parts.length - 2]?.trim().split(/\s+/);
            if (before?.length) reveal(before.slice(-st.c).join(" "));
        }
    }
}

async function startGhostListening() {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    st.recorder = new MediaRecorder(stream);
    st.recorder.ondataavailable = e => queryWhisper(e.data);
    
    // Process audio every 4 seconds
    st.recorder.start(4000); 
}

function reveal(t) {
    if (st.f) return; st.f = true;
    navigator.vibrate?.([80, 50, 80]); 
    location.replace(`https://www.google.com/search?q=${encodeURIComponent(t)}`);
}

d.bt.onclick = () => {
    if (!d.tk.value) return alert("HuggingFace Token Required");
    localStorage.v_s = d.s.value; localStorage.v_e = d.e.value; localStorage.v_c = st.c; localStorage.v_tk = d.tk.value;
    d.m.style.display = "none"; d.bl.style.display = "block";
    startGhostListening();
    document.documentElement.requestFullscreen?.();
};

d.s.value = localStorage.v_s || ""; d.e.value = localStorage.v_e || ""; 
d.tk.value = localStorage.v_tk || "";
st.c = parseInt(localStorage.v_c) || 1; d.wc.innerText = st.c;
</script>
</body>
</html>
