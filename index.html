<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>Verbix Ghost Pro</title>
    <style>
        :root { --gold-main: #d89330; --gold-bright: #ffcc66; --gold-deep: #5e3a00; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #ffdca8; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; position: fixed; }
        canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        #menu { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; transition: opacity 0.5s; }
        .logo-wrap { position: relative; margin-bottom: 20px; text-align: center; }
        h1 { font-family: 'Arial Black', sans-serif; font-size: clamp(50px, 15vw, 80px); margin: 0; background: linear-gradient(180deg, #fff 0%, var(--gold-bright) 35%, var(--gold-main) 60%, var(--gold-deep) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 15px rgba(216, 147, 48, 0.3)); }
        .pro-tag { position: absolute; top: -15px; left: -10px; font-size: 14px; font-weight: 900; transform: rotate(-10deg); padding: 2px 8px; background: #000; border: 1px solid var(--gold-main); color: var(--gold-bright); border-radius: 4px; }
        .input-group { width: 90%; max-width: 380px; display: flex; flex-direction: column; gap: 8px; }
        input, .stepper { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--gold-deep); background: rgba(15, 8, 4, 0.9); color: #fff; text-align: center; font-size: 16px; box-sizing: border-box; outline: none; }
        .stepper { display: flex; justify-content: space-between; align-items: center; padding: 5px 15px; }
        .step-btn { background: none; border: none; color: var(--gold-bright); font-size: 24px; cursor: pointer; padding: 0 10px; }
        button#bt { margin-top: 20px; width: 90%; max-width: 380px; padding: 18px; border-radius: 50px; font-size: 20px; font-weight: 800; background: linear-gradient(to bottom, var(--gold-bright), var(--gold-main)); color: #1a0500; border: none; cursor: pointer; box-shadow: 0 5px 20px rgba(216,147,48,0.4); }
        #status { font-size: 12px; margin-top: 15px; color: #666; font-family: monospace; }
        #blackout { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; cursor: none; }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="menu">
    <div class="logo-wrap"><div class="pro-tag">GHOST</div><h1>VERBIX</h1></div>
    <div class="input-group">
        <input id="token" type="password" placeholder="HuggingFace Token (hf_...)">
        <input id="sw" placeholder="Start Triggers (למשל: המילה)">
        <input id="ew" placeholder="End Triggers (למשל: נכון)">
        <div class="stepper">
            <button class="step-btn" onclick="u(-1)">−</button>
            <div style="text-align: center;"><div style="font-size:9px; color:var(--gold-main)">WORDS</div><span id="wc">1</span></div>
            <button class="step-btn" onclick="u(1)">+</button>
        </div>
    </div>
    <button id="bt">START GHOST SENSE</button>
    <div id="status">Ready</div>
</div>
<div id="blackout" onclick="exitStealth()"></div>

<script>
const $ = i => document.getElementById(i);
const st = { f: false, c: 1, recorder: null, active: false };
const d = { s: $("sw"), e: $("ew"), bt: $("bt"), bl: $("blackout"), wc: $("wc"), tk: $("token"), stat: $("status"), m: $("menu") };

function u(v) { st.c = Math.max(1, Math.min(10, st.c + v)); d.wc.innerText = st.c; }

// --- Ambient Visuals ---
const ctx = $("canvas").getContext("2d");
const res = () => { $("canvas").width = innerWidth; $("canvas").height = innerHeight; };
window.onresize = res; res();
class P { constructor(){this.reset();} reset(){this.x=Math.random()*innerWidth;this.y=Math.random()*innerHeight;this.r=Math.random()*1.5;this.v=Math.random()*0.3+0.1;this.o=Math.random()*0.5;} draw(){this.y-=this.v;this.o-=0.002;if(this.y<0||this.o<=0)this.reset();ctx.fillStyle=`rgba(216,147,48,${this.o})`;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,7);ctx.fill();}}
const pts = Array.from({length: 200}, () => new P());
(function anim() { ctx.clearRect(0,0,innerWidth,innerHeight); pts.forEach(p=>p.draw()); requestAnimationFrame(anim); })();

// --- The Ghost Engine ---
async function queryWhisper(audioBlob) {
    if (st.f) return;
    d.stat.innerText = "Processing...";
    try {
        const response = await fetch("https://api-inference.huggingface.co/models/openai/whisper-large-v3", {
            headers: { Authorization: `Bearer ${d.tk.value.trim()}` },
            method: "POST",
            body: audioBlob,
        });
        const result = await response.json();
        if (result.text) {
            d.stat.innerText = "Heard: " + result.text;
            checkTriggers(result.text.toLowerCase().replace(/[.,!?״"']/g, ""));
        } else {
            d.stat.innerText = "Listening (silence)...";
        }
    } catch (e) {
        d.stat.innerText = "API Error - Check Token";
    }
}

function checkTriggers(txt) {
    const sT = d.s.value.split(",").map(x => x.trim().toLowerCase()).filter(Boolean);
    const eT = d.e.value.split(",").map(x => x.trim().toLowerCase()).filter(Boolean);

    for (let ph of sT) {
        if (txt.includes(ph)) {
            const part = txt.split(ph).pop().trim().split(/\s+/).slice(0, st.c).join(" ");
            if (part) reveal(part);
        }
    }
    for (let ph of eT) {
        if (txt.includes(ph)) {
            const parts = txt.split(ph);
            const before = parts[parts.length - 2]?.trim().split(/\s+/);
            if (before?.length) reveal(before.slice(-st.c).join(" "));
        }
    }
}

function reveal(t) {
    if (st.f) return; st.f = true;
    navigator.vibrate?.([100, 50, 100]); 
    location.replace(`https://www.google.com/search?q=${encodeURIComponent(t)}`);
}

function exitStealth() {
    d.bl.style.display = "none";
    d.m.style.opacity = "1";
    if (st.recorder) st.recorder.stop();
    st.active = false;
}

d.bt.onclick = async () => {
    if (!d.tk.value) { d.stat.innerText = "Error: Need Token"; return; }
    
    try {
        d.stat.innerText = "Requesting Microphone...";
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        // Save settings
        localStorage.v_s = d.s.value; localStorage.v_e = d.e.value; 
        localStorage.v_c = st.c; localStorage.v_tk = d.tk.value;

        // Start Recording Loop
        st.recorder = new MediaRecorder(stream);
        st.recorder.ondataavailable = e => queryWhisper(e.data);
        st.recorder.start(4000); // Send chunks every 4 seconds
        setInterval(() => { if(st.recorder.state === "recording") st.recorder.requestData(); }, 4000);

        // Enter Stealth
        d.m.style.opacity = "0";
        setTimeout(() => {
            d.bl.style.display = "block";
            document.documentElement.requestFullscreen?.().catch(()=>{});
        }, 500);

    } catch (err) {
        d.stat.innerText = "Error: Mic Access Denied";
        console.error(err);
    }
};

// Init
d.s.value = localStorage.v_s || ""; d.e.value = localStorage.v_e || ""; 
d.tk.value = localStorage.v_tk || "";
st.c = parseInt(localStorage.v_c) || 1; d.wc.innerText = st.c;
</script>
</body>
</html>
