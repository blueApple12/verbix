<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>Verbix PRO</title>
    <style>
        :root { --gold-main: #d89330; --gold-bright: #ffcc66; --gold-deep: #5e3a00; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #1a0f05 0%, #000000 100%); color: #ffdca8; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; position: fixed; }
        canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        #menu { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; box-sizing: border-box; }
        .logo-wrap { position: relative; margin-bottom: 30px; display: inline-block; }
        h1 { font-family: 'Arial Black', sans-serif; font-size: clamp(60px, 18vw, 95px); margin: 0; line-height: 1; letter-spacing: 1px; text-transform: uppercase; background: linear-gradient(180deg, #ffffff 0%, var(--gold-bright) 35%, var(--gold-main) 60%, var(--gold-deep) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 25px rgba(216, 147, 48, 0.4)); }
        .pro-tag { position: absolute; top: -22px; left: -15px; font-size: 20px; font-weight: 900; transform: rotate(-10deg); z-index: 2; padding: 4px 12px; background: rgba(0,0,0,0.9); border-radius: 6px; border: 2px solid var(--gold-main); background-image: linear-gradient(180deg, #fff 0%, var(--gold-main) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .input-group { width: 90%; max-width: 380px; display: flex; flex-direction: column; gap: 10px; }
        input, .stepper { width: 100%; padding: 14px; border-radius: 12px; border: 2px solid var(--gold-deep); background: rgba(20, 10, 5, 0.85); color: #fff; text-align: center; font-size: 16px; box-sizing: border-box; }
        .stepper { display: flex; justify-content: space-between; align-items: center; padding: 5px 15px; }
        .step-btn { background: none; border: none; color: var(--gold-bright); font-size: 24px; cursor: pointer; width: 40px; }
        button#bt { margin-top: 25px; width: 90%; max-width: 380px; padding: 18px; border-radius: 50px; font-size: 20px; font-weight: 800; background: linear-gradient(to bottom, var(--gold-bright), var(--gold-main)); color: #1a0500; border: 1px solid #fff; cursor: pointer; }
        #blackout { position: fixed; inset: 0; background: #000; z-index: 999; display: none; touch-action: none; }
        #debug { position: absolute; top: 20px; width: 100%; text-align: center; color: #333; font-family: monospace; font-size: 12px; z-index: 1001; }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="debug">System Offline</div>

<div id="menu">
    <div class="logo-wrap"><div class="pro-tag">PRO</div><h1>VERBIX</h1></div>
    <div class="input-group">
        <input id="token" type="password" placeholder="HF Token (hf_...)">
        <input id="sw" placeholder="Start Trigger">
        <input id="ew" placeholder="End Trigger">
        <div class="stepper">
            <button class="step-btn" onclick="uS(-1)">−</button>
            <div style="text-align: center;"><div style="font-size:10px;color:var(--gold-main)">WORDS</div><span id="wc">1</span></div>
            <button class="step-btn" onclick="uS(1)">+</button>
        </div>
    </div>
    <button id="bt">ACTIVATE</button>
</div>

<div id="blackout"></div>

<script>
const $ = i => document.getElementById(i);
const d = { c: $("canvas"), m: $("menu"), bl: $("blackout"), bt: $("bt"), s: $("sw"), e: $("ew"), tk: $("token"), db: $("debug"), wc: $("wc") };
const ctx = d.c.getContext("2d");
let st = { f: false, r: 1, rec: null, ty: 0 };

function uS(v) { st.r = Math.max(1, Math.min(10, st.r + v)); d.wc.innerText = st.r; }

// Visuals
const res = () => { d.c.width = innerWidth; d.c.height = innerHeight; };
window.onresize = res; res();
class P { constructor(){this.reset();} reset(){this.x=Math.random()*innerWidth;this.y=Math.random()*innerHeight;this.r=Math.random()*2;this.v=Math.random()*0.5+0.2;this.o=Math.random()*0.6;} draw(){this.y-=this.v;this.o-=0.005;if(this.y<0||this.o<=0)this.reset();ctx.fillStyle=`rgba(216,147,48,${this.o})`;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,7);ctx.fill();}}
const pts = Array.from({length: 400}, () => new P());
(function anim() { ctx.clearRect(0,0,innerWidth,innerHeight); pts.forEach(p => p.draw()); requestAnimationFrame(anim); })();

async function sendToAI(blob) {
    if (st.f) return;
    d.db.innerText = "Syncing...";
    try {
        const response = await fetch("https://api-inference.huggingface.co/models/openai/whisper-tiny", {
            headers: { Authorization: `Bearer ${d.tk.value.trim()}` },
            method: "POST",
            body: blob
        });
        const res = await response.json();
        if (res.text) {
            const txt = res.text.toLowerCase().trim().replace(/[.,!?״"']/g, "");
            d.db.innerText = "Read: " + txt;
            handleTriggers(txt);
        } else if (res.error) {
            d.db.innerText = "AI Busy - Retrying...";
        }
    } catch (e) {
        d.db.innerText = "Connection Error";
    }
}

function handleTriggers(txt) {
    const sT = d.s.value.split(",").map(x => x.trim().toLowerCase()).filter(Boolean);
    const eT = d.e.value.split(",").map(x => x.trim().toLowerCase()).filter(Boolean);
    for (let p of sT) { if (txt.includes(p)) reveal(txt.split(p).pop().trim().split(/\s+/).slice(0, st.r).join(" ")); }
    for (let p of eT) { if (txt.includes(p)) { let b = txt.split(p); reveal(b[b.length-2]?.trim().split(/\s+/).slice(-st.r).join(" ")); }}
}

function reveal(t) {
    if (!t || st.f) return; st.f = true;
    navigator.vibrate?.([100, 50, 100]);
    location.replace("https://www.google.com/search?q=" + encodeURIComponent(t));
}

// Swipe Back
d.bl.ontouchstart = e => st.ty = e.touches[0].clientY;
d.bl.ontouchend = e => { if (e.changedTouches[0].clientY - st.ty > 100) location.reload(); };

d.bt.onclick = async () => {
    if (!d.tk.value) return;
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        d.m.style.display = "none"; d.bl.style.display = "block";
        localStorage.setItem('v_tk', d.tk.value);
        
        const process = () => {
            if (st.f) return;
            d.db.innerText = "Listening...";
            const recorder = new MediaRecorder(stream);
            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                sendToAI(new Blob(chunks, { type: 'audio/wav' }));
                if (!st.f) process();
            };
            recorder.start();
            setTimeout(() => { if(recorder.state === "recording") recorder.stop(); }, 4000);
        };
        process();
    } catch (e) { alert("Mic Access Needed"); }
};

d.tk.value = localStorage.getItem('v_tk') || "";
</script>
</body>
</html>
